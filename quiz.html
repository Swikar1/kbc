<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Challenge</title>
<style>
  :root {
    --bg-color: #ffffff;
    --dot-color: #2563eb;
    --tile-size: 250px;
    --text-main: #1e293b;
    --text-sub: #94a3b8;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --red: #ef4444;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --border: #e2e8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    width: 100%;
    background: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }

  .polka-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: var(--bg-color);
    background-repeat: repeat;
    background-size: var(--tile-size) var(--tile-size);
    animation: drift 35s linear infinite;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to   { background-position: 250px 0; }
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 22px;
    box-shadow: 0 12px 44px rgba(30,41,59,0.14);
    padding: 30px 28px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .progress-text {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-sub);
    letter-spacing: 0.02em;
  }

  .progress-bar-track {
    width: 100%;
    height: 5px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .question-box {
    min-height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.5;
    padding: 4px 4px 24px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text-main);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); }
  .option-btn:active:not(:disabled) { transform: scale(0.98); }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: #f1f5f9;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .option-btn.correct { background: var(--green-bg); border-color: var(--green-border); color: #166534; }
  .option-btn.correct .option-letter { background: var(--green); color: #fff; }
  .option-btn.incorrect { background: var(--red-bg); border-color: var(--red-border); color: #991b1b; }
  .option-btn.incorrect .option-letter { background: var(--red); color: #fff; }

  .timer-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .timer-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text-main);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .timer-circle.running { border-color: var(--accent); color: var(--accent-dark); }
  .timer-circle.warning { border-color: var(--red); color: var(--red); }

  .timer-btn {
    border: none;
    background: #f1f5f9;
    color: var(--text-main);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .timer-btn:hover:not(:disabled) { filter: brightness(0.95); }
  .timer-btn:disabled { opacity: 0.55; cursor: default; }

  .btn-next {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 13px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
  }
  .btn-next:active { transform: scale(0.98); }
  .btn-next:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-next:disabled { opacity: 0.5; cursor: default; }

  .score-box { text-align: center; }
  .score-box h2 { font-size: 1.5rem; margin-bottom: 10px; }
  .score-box p { color: var(--text-sub); margin-bottom: 22px; font-size: 1rem; }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
    .options-grid { grid-template-columns: 1fr; }
    .question-box { font-size: 1.05rem; min-height: 70px; }
  }
</style>
</head>

  <script>
    /* ---------- background: jittered-grid scattered dot tile ---------- */
    (function buildBackground() {
      const tileSize = 250;
      const cellSize = 22;
      const jitter = 8;
      const dotColor = '#2563eb';

      const canvas = document.createElement('canvas');
      canvas.width = tileSize;
      canvas.height = tileSize;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = dotColor;

      function drawDot(x, y, r) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      const cols = Math.round(tileSize / cellSize);
      const rows = Math.round(tileSize / cellSize);

      for (let cx = 0; cx < cols; cx++) {
        for (let cy = 0; cy < rows; cy++) {
          const baseX = cx * cellSize + cellSize / 2;
          const baseY = cy * cellSize + cellSize / 2;
          const x = baseX + (Math.random() - 0.5) * jitter * 2;
          const y = baseY + (Math.random() - 0.5) * jitter * 2;
          const r = 1 + Math.random() * 1.3;

          drawDot(x, y, r);
          drawDot(x - tileSize, y, r);
          drawDot(x + tileSize, y, r);
          drawDot(x, y - tileSize, r);
          drawDot(x, y + tileSize, r);
          drawDot(x - tileSize, y - tileSize, r);
          drawDot(x + tileSize, y - tileSize, r);
          drawDot(x - tileSize, y + tileSize, r);
          drawDot(x + tileSize, y + tileSize, r);
        }
      }

      const dataUrl = canvas.toDataURL();
      document.getElementById('polkaBg').style.backgroundImage = 'url(' + dataUrl + ')';
    })();

er", "Qin Shi Huang"], "correct": "D", "answer_text": "Qin Shi Huang"}, {"q": "What is the name of the principle that entropy always increases in an isolated system?", "options": ["Nuclear fission", "The Second Law of Thermodynamics", "An isotope", "Paleontology"], "correct": "B", "answer_text": "The Second Law of Thermodynamics"}, {"q": "Which philosopher's 'Categorical Imperative' is central to deontological ethics?", "options": ["Qin Shi Huang", "Johannes Kepler", "Richard Feynman", "Immanuel Kant"], "correct": "D", "answer_text": "Immanuel Kant"}, {"q": "What is the term for the merging of two galaxies over cosmic time?", "options": ["The stapes", "The Battle of Waterloo", "A galactic merger", "The Library of Alexandria"], "correct": "C", "answer_text": "A galactic merger"}, {"q": "Who discovered the structure of benzene, reportedly after dreaming of a snake?", "options": ["Helicase", "August Kekule", "Photosynthesis", "Jupiter"], "correct": "B", "answer_text": "August Kekule"}]}]; // array of {tier, questions:[{q, options, correct, answer_text}]}

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let session = [];
    let sessionIdx = 0;
    let score = 0;

    function buildSession() {
      // exactly one random question from each of the 10 tiers, in tier order
      session = QUIZ_DATA.map(tierObj => {
        const q = shuffle(tierObj.questions)[0];
        return Object.assign({ tier: tierObj.tier }, q);
      });
      sessionIdx = 0;
      score = 0;
    }

    const progressText = document.getElementById('progressText');
    const tierText = document.getElementById('tierText');
    const progressFill = document.getElementById('progressFill');
    const questionBox = document.getElementById('questionBox');
    const optionsGrid = document.getElementById('optionsGrid');
    const nextBtn = document.getElementById('nextBtn');
    const quizArea = document.getElementById('quizArea');
    const scoreBox = document.getElementById('scoreBox');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const timerBtn = document.getElementById('timerBtn');
    const timerCircle = document.getElementById('timerCircle');

    function loadQuestion() {
      if (sessionIdx >= session.length) {
        showFinalScore();
        return;
      }
      stopTimer();
      nextBtn.disabled = true;

      const item = session[sessionIdx];
      progressText.textContent = (sessionIdx + 1) + ' / ' + session.length;
      tierText.textContent = 'Tier ' + item.tier;
      progressFill.style.width = (sessionIdx / session.length * 100) + '%';
      questionBox.textContent = item.q;

      optionsGrid.innerHTML = '';
      const letters = ['A','B','C','D'];
      item.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = '<span class="option-letter">' + letters[i] + '</span><span>' + opt + '</span>';
        btn.addEventListener('click', () => selectOption(letters[i], btn));
        optionsGrid.appendChild(btn);
      });
    }

    function selectOption(letter, btnEl) {
      const allBtns = [...optionsGrid.children];
      if (allBtns.some(b => b.disabled)) return; // already answered
      allBtns.forEach(b => b.disabled = true);

      const item = session[sessionIdx];
      const correctIdx = ['A','B','C','D'].indexOf(item.correct);
      allBtns[correctIdx].classList.add('correct');
      if (letter !== item.correct) {
        btnEl.classList.add('incorrect');
      } else {
        score++;
      }
      stopTimer();
      nextBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
      sessionIdx++;
      loadQuestion();
    });

    function showFinalScore() {
      quizArea.style.display = 'none';
      scoreBox.style.display = 'block';
      finalScoreText.textContent = 'Score: ' + score + ' / ' + session.length;
    }

    restartBtn.addEventListener('click', () => {
      quizArea.style.display = 'block';
      scoreBox.style.display = 'none';
      buildSession();
      loadQuestion();
    });

    /* ---------- independent 30s timer (always startable/stoppable) ---------- */
    let timerInterval = null;
    let timeLeft = 30;

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timeLeft = 30;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('running', 'warning');
      timerBtn.disabled = false;
      timerBtn.textContent = 'Start Timer';
    }

    function startTimer() {
      if (timerInterval !== null) return;
      timeLeft = 30;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('warning');
      timerCircle.classList.add('running');
      timerBtn.disabled = true;
      timerBtn.textContent = 'Running...';

      timerInterval = setInterval(function () {
        timeLeft = timeLeft - 1;
        if (timeLeft <= 0) {
          timerCircle.textContent = '0';
          clearInterval(timerInterval);
          timerInterval = null;
          timerBtn.disabled = false;
          timerBtn.textContent = 'Start Timer';
          timerCircle.classList.remove('running');
          return;
        }
        timerCircle.textContent = timeLeft;
        if (timeLeft <= 10) {
          timerCircle.classList.add('warning');
        }
      }, 1000);
    }

    timerBtn.addEventListener('click', startTimer);

    /* ---------- init ---------- */
    buildSession();
    loadQuestion();
  </script>
