<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KBC</title>
<style>
  :root {
    --bg-color: #ffffff;
    --dot-color: #2563eb;
    --tile-size: 250px;
    --text-main: #1e293b;
    --text-sub: #94a3b8;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --red: #ef4444;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --border: #e2e8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }

  .polka-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #f8fbff;
    background-image: radial-gradient(circle, rgba(37, 99, 235, 0.9) 1.6px, transparent 1.9px),
                      radial-gradient(circle, rgba(147, 197, 253, 0.9) 1.6px, transparent 1.9px);
    background-position: 0 0, 17px 17px;
    background-size: 34px 34px;
    background-repeat: repeat;
    animation: drift 18s linear infinite;
  }
  @keyframes drift {
    from { background-position: 0 0, 17px 17px; }
    to   { background-position: 34px 0, 51px 17px; }
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 22px;
    box-shadow: 0 12px 44px rgba(30,41,59,0.14);
    padding: 30px 28px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .progress-text {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-sub);
    letter-spacing: 0.02em;
  }

  .progress-bar-track {
    width: 100%;
    height: 5px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .question-box {
    min-height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.5;
    padding: 4px 4px 24px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text-main);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); }
  .option-btn:active:not(:disabled) { transform: scale(0.98); }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: #f1f5f9;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .option-btn.correct { background: var(--green-bg); border-color: var(--green-border); color: #166534; }
  .option-btn.correct .option-letter { background: var(--green); color: #fff; }
  .option-btn.incorrect { background: var(--red-bg); border-color: var(--red-border); color: #991b1b; }
  .option-btn.incorrect .option-letter { background: var(--red); color: #fff; }

  .timer-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .timer-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text-main);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .timer-circle.running { border-color: var(--accent); color: var(--accent-dark); }
  .timer-circle.warning { border-color: var(--red); color: var(--red); }

  .timer-btn {
    border: none;
    background: #f1f5f9;
    color: var(--text-main);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .timer-btn:hover:not(:disabled) { filter: brightness(0.95); }
  .timer-btn:disabled { opacity: 0.55; cursor: default; }

  .btn-next {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 13px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
  }
  .btn-next:active { transform: scale(0.98); }
  .btn-next:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-next:disabled { opacity: 0.5; cursor: default; }

  .btn-reveal {
    width: 100%;
    border: 1px solid rgba(37,99,235,0.35);
    background: rgba(37,99,235,0.08);
    color: var(--accent-dark);
    padding: 11px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 10px;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }
  .btn-reveal:hover:not(:disabled) { filter: brightness(0.98); }
  .btn-reveal:disabled { opacity: 0.5; cursor: default; }

  .score-box { text-align: center; }
  .score-box h2 { font-size: 1.5rem; margin-bottom: 10px; }
  .score-box p { color: var(--text-sub); margin-bottom: 22px; font-size: 1rem; }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
    .options-grid { grid-template-columns: 1fr; }
    .question-box { font-size: 1.05rem; min-height: 70px; }
  }
</style>
</head>

  <div class="polka-bg" id="polkaBg"></div>

        <div class="timer-row">

        ["Which ancient Greek historian wrote about the Peloponnesian War?", ["Thucydides", "Herodotus", "Plato", "Aristotle"]],
        ["Which principle divides government authority among branches?", ["Separation of powers", "Collective security", "Federal supremacy", "Judicial review"]]
      ],
      science: [
        ["What is the resultant force on a 4 kg object accelerating at 3 m/s²?", ["12 N", "7 N", "1.33 N", "24 N"]],
        ["A solution with pH 3 is how many times more acidic than pH 5?", ["100 times", "2 times", "20 times", "1,000 times"]],
        ["What is the probability of drawing two aces in succession without replacement from a deck?", ["1/221", "1/169", "1/52", "4/52"]],
        ["Which process creates genetically different gametes?", ["Meiosis", "Mitosis", "Binary fission", "Budding"]]
      ]
    };

    const GRADE_11_BANK = {
      general: [
        ["Which treaty established the modern borders of much of Europe after Napoleon?", ["Congress of Vienna", "Treaty of Utrecht", "Treaty of Westphalia", "Treaty of Brest-Litovsk"]],
        ["Which economic measure tracks the total value of goods and services produced domestically?", ["GDP", "CPI", "Gini coefficient", "Balance of payments"]],
        ["Who developed the concept of the categorical imperative?", ["Immanuel Kant", "John Stuart Mill", "David Hume", "Georg Hegel"]],
        ["Which empire reached its greatest extent under Trajan?", ["Roman Empire", "Persian Empire", "Mongol Empire", "Byzantine Empire"]],
        ["Which literary work is an example of magical realism?", ["One Hundred Years of Solitude", "The Divine Comedy", "Beowulf", "The Waste Land"]],
        ["Which agreement divided newly discovered territories between Spain and Portugal?", ["Treaty of Tordesillas", "Treaty of Zaragoza", "Treaty of Cateau-Cambrésis", "Treaty of Utrecht"]],
        ["Which term describes rule by a small, powerful group?", ["Oligarchy", "Anarchy", "Plutocracy", "Meritocracy"]],
        ["Which war is associated with the battles of Gettysburg and Antietam?", ["American Civil War", "American Revolution", "War of 1812", "Mexican-American War"]],
        ["Which thinker wrote 'The Republic'?", ["Plato", "Aristotle", "Socrates", "Cicero"]],
        ["Which body has primary responsibility for international peace and security?", ["UN Security Council", "UN General Assembly", "World Court", "NATO Parliamentary Assembly"]],
        ["Which civilization created the Rosetta Stone's hieroglyphic inscription?", ["Ancient Egyptians", "Ancient Greeks", "Romans", "Carthaginians"]],
        ["Which term describes a government's authority over its territory?", ["Sovereignty", "Legitimacy", "Jurisdiction", "Federalism"]]
      ],
      science: [
        ["According to Ohm's law, what current flows through 6 Ω at 12 V?", ["2 A", "0.5 A", "6 A", "72 A"]],
        ["What is the limiting reagent when 2 mol H₂ reacts with 2 mol O₂?", ["H₂", "O₂", "H₂O", "Neither"]],
        ["Which mechanism increases variation by exchanging DNA between homologous chromosomes?", ["Crossing over", "Translation", "Transcription", "Independent assortment"]],
        ["What is the integral of 2x from 0 to 3?", ["9", "6", "12", "18"]]
      ]
    };

    const GRADE_12_BANK = {
      general: [
        ["Which peace settlement ended the Thirty Years' War?", ["Peace of Westphalia", "Treaty of Versailles", "Peace of Augsburg", "Treaty of Nijmegen"]],
        ["Which theory argues that states act primarily to maximize security in an anarchic system?", ["Realism", "Liberalism", "Constructivism", "Functionalism"]],
        ["Which philosopher wrote 'Critique of Pure Reason'?", ["Immanuel Kant", "René Descartes", "Baruch Spinoza", "John Locke"]],
        ["Which event is considered the start of the Protestant Reformation?", ["Martin Luther's Ninety-five Theses", "The Council of Trent", "The English Civil War", "The Peace of Augsburg"]],
        ["Which empire used the devshirme system to recruit administrators?", ["Ottoman Empire", "Safavid Empire", "Mughal Empire", "Habsburg Empire"]],
        ["Which concept describes the spread of cultural traits across societies?", ["Cultural diffusion", "Cultural lag", "Ethnocentrism", "Assimilation"]],
        ["Which work is associated with the phrase 'the banality of evil'?", ["Eichmann in Jerusalem", "The Origins of Totalitarianism", "The Prince", "Leviathan"]],
        ["Which economic theory emphasizes government spending during recessions?", ["Keynesian economics", "Monetarism", "Classical economics", "Supply-side economics"]],
        ["Which court prosecutes individuals for genocide and crimes against humanity?", ["International Criminal Court", "International Court of Justice", "European Court of Human Rights", "Permanent Court of Arbitration"]],
        ["Which historian wrote 'The Decline and Fall of the Roman Empire'?", ["Edward Gibbon", "Thucydides", "Herodotus", "Arnold Toynbee"]],
        ["Which document proclaimed the independence of the thirteen American colonies?", ["Declaration of Independence", "Articles of Confederation", "Federalist Papers", "Virginia Declaration of Rights"]],
        ["Which political idea holds that legitimate authority comes from the people?", ["Popular sovereignty", "Divine right", "Laissez-faire", "Collective punishment"]]
      ],
      science: [
        ["What is the derivative of ln(x² + 1)?", ["2x/(x² + 1)", "1/(x² + 1)", "2/(x² + 1)", "ln(2x)"]],
        ["For a first-order reaction, what happens to its half-life as initial concentration changes?", ["It remains constant", "It doubles", "It halves", "It becomes zero"]],
        ["Which quantum number describes the shape of an orbital?", ["Azimuthal quantum number", "Principal quantum number", "Magnetic quantum number", "Spin quantum number"]],
        ["A population in Hardy-Weinberg equilibrium has p = 0.7. What is the frequency of heterozygotes?", ["0.42", "0.49", "0.21", "0.09"]]
      ]
    };

    const GRADE_BANKS = [GRADE_8_BANK, GRADE_9_BANK, GRADE_10_BANK, GRADE_11_BANK, GRADE_12_BANK];
    const QUESTION_SEEDS = Array.from({ length: 10 }, (_, tierIndex) => {
      const gradeBank = GRADE_BANKS[Math.floor(tierIndex / 2)];
      const general = shuffle([...gradeBank.general]).slice(0, 8);
      const science = shuffle([...gradeBank.science]).slice(0, 2);
      return [...general, ...science];
    });

    function createQuestion(text, options, variant) {
      const offset = variant % options.length;
      const rotated = options.slice(offset).concat(options.slice(0, offset));
      const correctIndex = (options.length - offset) % options.length;
      return { q: text, options: rotated, correct: ['A', 'B', 'C', 'D'][correctIndex], answer_text: options[0] };
    }

    function buildQuestionPools() {
      const harderSeedSets = QUESTION_SEEDS.map((seeds, tierIndex) => {
        const difficultyBoost = tierIndex + 1;
        return {
          tier: tierIndex + 1,
          questions: Array.from({ length: 500 }, (_, index) => {
            const baseIndex = (index * (difficultyBoost + 3) + tierIndex * 7) % seeds.length;
            const seed = seeds[baseIndex];
            return createQuestion(seed[0], seed[1], index + difficultyBoost * 11 + tierIndex * 5);
          })
        };
      });

      return harderSeedSets;
    }

    const QUIZ_DATA = buildQuestionPools();
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let session = [];
    let sessionIdx = 0;
    let score = 0;
    let currentCorrectLetter = 'A';
    const correctSound = new Audio('7 CRORE KBC - SOUND EFFECT [fl6xbIdBSic] (1).mp3');

    function playAnswerSound(isCorrect) {
      if (isCorrect) {
        correctSound.currentTime = 0;
        correctSound.play().catch(() => {});
        return;
      }

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const ctx = new AudioCtx();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = 'sawtooth';
      oscillator.frequency.setValueAtTime(220, ctx.currentTime);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.26);

      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.28);
      oscillator.onended = () => ctx.close();
    }

    function buildSession() {
      // true progressive difficulty: tier 1 to tier 10 in order
      session = QUIZ_DATA.map((tierObj, index) => {
        const q = shuffle(tierObj.questions)[0];
        return Object.assign({ tier: index + 1 }, q);
      });
      sessionIdx = 0;
      score = 0;
    }

    const progressText = document.getElementById('progressText');
    const tierText = document.getElementById('tierText');
    const progressFill = document.getElementById('progressFill');
    const questionBox = document.getElementById('questionBox');
    const optionsGrid = document.getElementById('optionsGrid');
    const revealBtn = document.getElementById('revealBtn');
    const nextBtn = document.getElementById('nextBtn');
    const quizArea = document.getElementById('quizArea');
    const scoreBox = document.getElementById('scoreBox');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const timerBtn = document.getElementById('timerBtn');
    const timerCircle = document.getElementById('timerCircle');

    function loadQuestion() {
      if (sessionIdx >= session.length) {
        showFinalScore();
        return;
      }
      stopTimer();
      revealBtn.disabled = false;
      nextBtn.disabled = true;

      const item = session[sessionIdx];
      progressText.textContent = (sessionIdx + 1) + ' / ' + session.length;
      tierText.textContent = 'Tier ' + item.tier;
      progressFill.style.width = (sessionIdx / session.length * 100) + '%';
      questionBox.textContent = item.q;

      const baseLetters = ['A','B','C','D'];
      currentCorrectLetter = item.correct;

      optionsGrid.innerHTML = '';
      item.options.forEach((opt, i) => {
        const letter = baseLetters[i];
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.letter = letter;
        btn.innerHTML = '<span class="option-letter">' + letter + '</span><span>' + opt + '</span>';
        btn.addEventListener('click', () => selectOption(letter, btn));
        optionsGrid.appendChild(btn);
      });
    }

    function revealAnswer() {
      const allBtns = [...optionsGrid.children];
      if (!allBtns.length) return;
      if (allBtns.some(b => b.disabled)) return;

      const correctBtn = allBtns.find(b => b.dataset.letter === currentCorrectLetter);
      allBtns.forEach(b => b.disabled = true);
      if (correctBtn) correctBtn.classList.add('correct');
      revealBtn.disabled = true;
      nextBtn.disabled = false;
    }

    function selectOption(letter, btnEl) {
      const allBtns = [...optionsGrid.children];
      if (allBtns.some(b => b.disabled)) return; // already answered
      allBtns.forEach(b => b.disabled = true);

      const correctBtn = allBtns.find(b => b.dataset.letter === currentCorrectLetter);
      const isCorrect = letter === currentCorrectLetter;
      if (correctBtn) correctBtn.classList.add('correct');
      if (!isCorrect) {
        btnEl.classList.add('incorrect');
      } else {
        score++;
      }
      playAnswerSound(isCorrect);
      stopTimer();
      revealBtn.disabled = true;
      nextBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
      sessionIdx++;
      loadQuestion();
    });

    revealBtn.addEventListener('click', revealAnswer);

    function showFinalScore() {
      quizArea.style.display = 'none';
      scoreBox.style.display = 'block';
      finalScoreText.textContent = 'Score: ' + score + ' / ' + session.length;
    }

    restartBtn.addEventListener('click', () => {
      quizArea.style.display = 'block';
      scoreBox.style.display = 'none';
      buildSession();
      loadQuestion();
    });

    /* ---------- independent 30s timer (always startable/stoppable) ---------- */
    let timerInterval = null;
    let timeLeft = 30;

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timeLeft = 30;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('running', 'warning');
      timerBtn.disabled = false;
      timerBtn.textContent = 'Start Timer';
    }

    function startTimer() {
      if (timerInterval !== null) return;
      timeLeft = 30;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('warning');
      timerCircle.classList.add('running');
      timerBtn.disabled = true;
      timerBtn.textContent = 'Running...';

      timerInterval = setInterval(function () {
        timeLeft = timeLeft - 1;
        if (timeLeft <= 0) {
          timerCircle.textContent = '0';
          clearInterval(timerInterval);
          timerInterval = null;
          timerBtn.disabled = false;
          timerBtn.textContent = 'Start Timer';
          timerCircle.classList.remove('running');
          return;
        }
        timerCircle.textContent = timeLeft;
        if (timeLeft <= 10) {
          timerCircle.classList.add('warning');
        }
      }, 1000);
    }

    timerBtn.addEventListener('click', startTimer);

    /* ---------- init ---------- */
    buildSession();
    loadQuestion();
  </script>

</body>
