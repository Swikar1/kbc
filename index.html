<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moving Polka Dot Background</title>
<style>
  :root {
    --bg-color: #ffffff;
    --dot-color: #2563eb;
    --tile-size: 250px;
    --text-main: #1e293b;
    --text-sub: #94a3b8;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --red: #ef4444;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --border: #e2e8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }

  .polka-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #f8fbff;
    background-image: radial-gradient(circle, rgba(37, 99, 235, 0.9) 1.6px, transparent 1.9px),
                      radial-gradient(circle, rgba(147, 197, 253, 0.9) 1.6px, transparent 1.9px);
    background-position: 0 0, 17px 17px;
    background-size: 34px 34px;
    background-repeat: repeat;
    animation: drift 18s linear infinite;
  }
  @keyframes drift {
    from { background-position: 0 0, 17px 17px; }
    to   { background-position: 34px 0, 51px 17px; }
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 22px;
    box-shadow: 0 12px 44px rgba(30,41,59,0.14);
    padding: 30px 28px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .progress-text {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-sub);
    letter-spacing: 0.02em;
  }

  .progress-bar-track {
    width: 100%;
    height: 5px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .question-box {
    min-height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.5;
    padding: 4px 4px 24px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text-main);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); }
  .option-btn:active:not(:disabled) { transform: scale(0.98); }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: #f1f5f9;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .option-btn.correct { background: var(--green-bg); border-color: var(--green-border); color: #166534; }
  .option-btn.correct .option-letter { background: var(--green); color: #fff; }
  .option-btn.incorrect { background: var(--red-bg); border-color: var(--red-border); color: #991b1b; }
  .option-btn.incorrect .option-letter { background: var(--red); color: #fff; }

  .timer-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .timer-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text-main);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .timer-circle.running { border-color: var(--accent); color: var(--accent-dark); }
  .timer-circle.warning { border-color: var(--red); color: var(--red); }

  .timer-btn {
    border: none;
    background: #f1f5f9;
    color: var(--text-main);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .timer-btn:hover:not(:disabled) { filter: brightness(0.95); }
  .timer-btn:disabled { opacity: 0.55; cursor: default; }

  .btn-next {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 13px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
  }
  .btn-next:active { transform: scale(0.98); }
  .btn-next:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-next:disabled { opacity: 0.5; cursor: default; }

  .btn-reveal {
    width: 100%;
    border: 1px solid rgba(37,99,235,0.35);
    background: rgba(37,99,235,0.08);
    color: var(--accent-dark);
    padding: 11px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 10px;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }
  .btn-reveal:hover:not(:disabled) { filter: brightness(0.98); }
  .btn-reveal:disabled { opacity: 0.5; cursor: default; }

  .score-box { text-align: center; }
  .score-box h2 { font-size: 1.5rem; margin-bottom: 10px; }
  .score-box p { color: var(--text-sub); margin-bottom: 22px; font-size: 1rem; }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
    .options-grid { grid-template-columns: 1fr; }
    .question-box { font-size: 1.05rem; min-height: 70px; }
  }
</style>
</head>
<body>

  <div class="polka-bg" id="polkaBg"></div>

  <div class="wrap">
    <div class="card">
      <div id="quizArea">
        <div class="card-top">
          <span class="progress-text" id="progressText">1 / 10</span>
          <span class="progress-text" id="tierText">Tier 1</span>
        </div>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>

        <div class="question-box" id="questionBox"></div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="timer-row">
          <div class="timer-circle" id="timerCircle">30</div>
          <button class="timer-btn" id="timerBtn">Start Timer</button>
        </div>

        <button class="btn-reveal" id="revealBtn">Reveal Answer</button>
        <button class="btn-next" id="nextBtn" disabled>Next</button>
      </div>

      <div class="score-box" id="scoreBox" style="display:none;">
        <h2>Done!</h2>
        <p id="finalScoreText"></p>
        <button class="btn-next" id="restartBtn">New Quiz</button>
      </div>
    </div>
  </div>

  <script>
    /* ---------- quiz data ---------- */
    const QUESTION_SEEDS = [
      [
        ['Which theorem states that every bounded sequence in R^n has a convergent subsequence?', ['Bolzano–Weierstrass theorem', 'Heine–Borel theorem', 'Banach fixed-point theorem', 'Arzelà–Ascoli theorem']],
        ['Which distribution is the conjugate prior for a Bernoulli likelihood?', ['Beta distribution', 'Gamma distribution', 'Normal distribution', 'Poisson distribution']],
        ['Which process removes introns from a eukaryotic pre-mRNA?', ['RNA splicing', 'RNA editing', 'Polyadenylation', 'Capping']],
        ['Which law gives the relationship between entropy and the number of microstates?', ['Boltzmann entropy formula', 'Hooke\'s law', 'Lenz\'s law', 'Planck\'s law']],
        ['In algebraic topology, what is the fundamental group of the circle?', ['The integers Z', 'The trivial group', 'The integers modulo 2', 'The real numbers R']]
      ],
      [
        ['What is the oxidation state of chromium in dichromate, Cr2O7^2−?', ['+6', '+3', '+7', '+2']],
        ['Which moon has a thick nitrogen atmosphere and methane lakes?', ['Titan', 'Triton', 'Europa', 'Ganymede']],
        ['Which theorem relates a line integral around a closed curve to a surface integral?', ['Stokes\' theorem', 'Green\'s theorem', 'Gauss\'s law', 'Cauchy\'s theorem']],
        ['Which statistical test compares the means of more than two groups?', ['ANOVA', 'Mann–Whitney U', 'Durbin–Watson', 'Kolmogorov–Smirnov']],
        ['Which economist wrote The General Theory of Employment, Interest and Money?', ['John Maynard Keynes', 'Milton Friedman', 'David Ricardo', 'Joseph Schumpeter']]
      ],
      [
        ['Which enzyme unwinds the DNA double helix during replication?', ['Helicase', 'Ligase', 'Primase', 'Topoisomerase']],
        ['Which planet is the largest in the Solar System?', ['Jupiter', 'Saturn', 'Earth', 'Neptune']],
        ['What is the antiderivative of 2x?', ['x^2 + C', 'x + C', '2x^2 + C', 'x^3 + C']],
        ['Which composer wrote the Brandenburg Concertos?', ['Johann Sebastian Bach', 'George Frideric Handel', 'Antonio Vivaldi', 'Joseph Haydn']],
        ['Which city is the capital of Kyrgyzstan?', ['Bishkek', 'Dushanbe', 'Tashkent', 'Ashgabat']]
      ],
      [
        ['Who painted The Garden of Earthly Delights?', ['Hieronymus Bosch', 'Pieter Bruegel the Elder', 'Jan van Eyck', 'Albrecht Dürer']],
        ['Which element has the greatest electronegativity on the Pauling scale?', ['Fluorine', 'Oxygen', 'Chlorine', 'Nitrogen']],
        ['Which treaty divided newly discovered lands between Spain and Portugal?', ['Treaty of Tordesillas', 'Treaty of Zaragoza', 'Treaty of Cateau-Cambrésis', 'Treaty of Utrecht']],
        ['What is the molar mass of water?', ['18 g/mol', '16 g/mol', '20 g/mol', '12 g/mol']],
        ['Which organelle translates messenger RNA into a polypeptide?', ['Ribosome', 'Nucleolus', 'Golgi apparatus', 'Peroxisome']]
      ],
      [
        ['Which moon has a thick nitrogen atmosphere and methane lakes?', ['Titan', 'Triton', 'Europa', 'Ganymede']],
        ['Which theorem guarantees a root when a continuous function changes sign?', ['Intermediate Value Theorem', 'Mean Value Theorem', 'Extreme Value Theorem', 'Fundamental Theorem of Algebra']],
        ['Who wrote The Master and Margarita?', ['Mikhail Bulgakov', 'Boris Pasternak', 'Fyodor Dostoevsky', 'Nikolai Gogol']],
        ['Which battle ended Napoleon\'s rule as emperor?', ['Waterloo', 'Leipzig', 'Austerlitz', 'Borodino']],
        ['Which language family includes Finnish, Hungarian, and Estonian?', ['Uralic', 'Altaic', 'Dravidian', 'Kartvelian']]
      ],
      [
        ['Who first measured the charge-to-mass ratio of the electron?', ['J. J. Thomson', 'Robert Millikan', 'Ernest Rutherford', 'James Chadwick']],
        ['Which river forms much of the border between Texas and Mexico?', ['Rio Grande', 'Colorado River', 'Yukon River', 'Brazos River']],
        ['Which composer wrote the opera Wozzeck?', ['Alban Berg', 'Arnold Schoenberg', 'Anton Webern', 'Gustav Mahler']],
        ['Which theorem relates a line integral around a closed curve to a surface integral?', ['Stokes\' theorem', 'Green\'s theorem', 'Gauss\'s law', 'Cauchy\'s theorem']],
        ['Which immunoglobulin crosses the placenta most efficiently?', ['IgG', 'IgA', 'IgM', 'IgE']]
      ],
      [
        ['Which process removes introns from a eukaryotic pre-mRNA?', ['RNA splicing', 'RNA editing', 'Polyadenylation', 'Capping']],
        ['Which gas law states that pressure is inversely proportional to volume at constant temperature?', ['Boyle\'s law', 'Charles\'s law', 'Graham\'s law', 'Dalton\'s law']],
        ['Which philosopher defended the categorical imperative?', ['Immanuel Kant', 'G. W. F. Hegel', 'David Hume', 'John Stuart Mill']],
        ['Which battle is considered the turning point on the Eastern Front in World War II?', ['Stalingrad', 'Kursk', 'Moscow', 'Leningrad']],
        ['Which number system is used in the RSA cryptosystem\'s key construction?', ['Modular arithmetic', 'Boolean algebra', 'Linear algebra', 'Vector calculus']]
      ],
      [
        ['Which theorem says every bounded sequence in R^n has a convergent subsequence?', ['Bolzano–Weierstrass theorem', 'Heine–Borel theorem', 'Banach fixed-point theorem', 'Arzelà–Ascoli theorem']],
        ['Which protein complex carries out oxidative phosphorylation in mitochondria?', ['Electron transport chain', 'Ribosome', 'Proteasome', 'Spliceosome']],
        ['Which painter created Las Meninas?', ['Diego Velázquez', 'Francisco Goya', 'El Greco', 'Bartolomé Murillo']],
        ['Which international agreement governs the non-navigational uses of international watercourses?', ['UN Watercourses Convention', 'MARPOL Convention', 'Ramsar Convention', 'Basel Convention']],
        ['Which distribution is the conjugate prior for a Bernoulli likelihood?', ['Beta distribution', 'Gamma distribution', 'Normal distribution', 'Poisson distribution']]
      ],
      [
        ['Which law gives the relationship between entropy and the number of microstates?', ['Boltzmann entropy formula', 'Hooke\'s law', 'Lenz\'s law', 'Planck\'s law']],
        ['Which philosopher wrote Being and Time?', ['Martin Heidegger', 'Edmund Husserl', 'Jean-Paul Sartre', 'Maurice Merleau-Ponty']],
        ['Which enzyme synthesizes RNA from a DNA template?', ['RNA polymerase', 'DNA ligase', 'Reverse transcriptase', 'DNA polymerase III']],
        ['Which curve is the locus of points whose distances from a focus and directrix are equal?', ['Parabola', 'Ellipse', 'Hyperbola', 'Cardioid']],
        ['Which theorem characterizes compact subsets of Euclidean space as closed and bounded?', ['Heine–Borel theorem', 'Hahn–Banach theorem', 'Riesz representation theorem', 'Lagrange theorem']]
      ],
      [
        ['In algebraic topology, what is the fundamental group of the circle?', ['The integers Z', 'The trivial group', 'The integers modulo 2', 'The real numbers R']],
        ['Which theorem states that every finite division ring is commutative?', ['Wedderburn\'s little theorem', 'Cayley–Hamilton theorem', 'Sylow theorem', 'Noether isomorphism theorem']],
        ['Which particle mediates the strong nuclear force?', ['Gluon', 'Photon', 'W boson', 'Graviton']],
        ['What is the residue of 1/z at z = 0?', ['1', '0', '−1', 'It is undefined']],
        ['Which result says a sufficiently large integer must contain a prime factor in a specified interval?', ['Bertrand\'s postulate', 'Fermat\'s Last Theorem', 'Wilson\'s theorem', 'Dirichlet\'s theorem']]
      ]
    ];

    function createQuestion(text, options, variant) {
      const offset = variant % options.length;
      const rotated = options.slice(offset).concat(options.slice(0, offset));
      const correctIndex = (options.length - offset) % options.length;
      return { q: text, options: rotated, correct: ['A', 'B', 'C', 'D'][correctIndex], answer_text: options[0] };
    }

    function buildQuestionPools() {
      return QUESTION_SEEDS.map((seeds, tierIndex) => ({
        tier: tierIndex + 1,
        questions: Array.from({ length: 150 }, (_, index) => {
          const seed = seeds[index % seeds.length];
          return createQuestion(seed[0], seed[1], index);
        })
      }));
    }

    const QUIZ_DATA = buildQuestionPools();
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let session = [];
    let sessionIdx = 0;
    let score = 0;
    let currentCorrectLetter = 'A';

    function playAnswerSound(isCorrect) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const ctx = new AudioCtx();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = isCorrect ? 'triangle' : 'sawtooth';
      oscillator.frequency.setValueAtTime(isCorrect ? 620 : 220, ctx.currentTime);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.26);

      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.28);
      oscillator.onended = () => ctx.close();
    }

    function buildSession() {
      // exactly one random question from each of the 10 tiers, in tier order
      session = QUIZ_DATA.map(tierObj => {
        const q = shuffle(tierObj.questions)[0];
        return Object.assign({ tier: tierObj.tier }, q);
      });
      sessionIdx = 0;
      score = 0;
    }

    const progressText = document.getElementById('progressText');
    const tierText = document.getElementById('tierText');
    const progressFill = document.getElementById('progressFill');
    const questionBox = document.getElementById('questionBox');
    const optionsGrid = document.getElementById('optionsGrid');
    const revealBtn = document.getElementById('revealBtn');
    const nextBtn = document.getElementById('nextBtn');
    const quizArea = document.getElementById('quizArea');
    const scoreBox = document.getElementById('scoreBox');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const timerBtn = document.getElementById('timerBtn');
    const timerCircle = document.getElementById('timerCircle');

    function loadQuestion() {
      if (sessionIdx >= session.length) {
        showFinalScore();
        return;
      }
      stopTimer();
      revealBtn.disabled = false;
      nextBtn.disabled = true;

      const item = session[sessionIdx];
      progressText.textContent = (sessionIdx + 1) + ' / ' + session.length;
      tierText.textContent = 'Tier ' + item.tier;
      progressFill.style.width = (sessionIdx / session.length * 100) + '%';
      questionBox.textContent = item.q;

      const baseLetters = ['A','B','C','D'];
      const shuffledLetters = shuffle(baseLetters);
      const correctIndex = baseLetters.indexOf(item.correct);
      currentCorrectLetter = shuffledLetters[correctIndex];

      optionsGrid.innerHTML = '';
      item.options.forEach((opt, i) => {
        const letter = shuffledLetters[i];
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.letter = letter;
        btn.innerHTML = '<span class="option-letter">' + letter + '</span><span>' + opt + '</span>';
        btn.addEventListener('click', () => selectOption(letter, btn));
        optionsGrid.appendChild(btn);
      });
    }

    function revealAnswer() {
      const allBtns = [...optionsGrid.children];
      if (!allBtns.length) return;
      if (allBtns.some(b => b.disabled)) return;

      const correctBtn = allBtns.find(b => b.dataset.letter === currentCorrectLetter);
      allBtns.forEach(b => b.disabled = true);
      if (correctBtn) correctBtn.classList.add('correct');
      revealBtn.disabled = true;
      nextBtn.disabled = false;
    }

    function selectOption(letter, btnEl) {
      const allBtns = [...optionsGrid.children];
      if (allBtns.some(b => b.disabled)) return; // already answered
      allBtns.forEach(b => b.disabled = true);

      const correctBtn = allBtns.find(b => b.dataset.letter === currentCorrectLetter);
      const isCorrect = letter === currentCorrectLetter;
      if (correctBtn) correctBtn.classList.add('correct');
      if (!isCorrect) {
        btnEl.classList.add('incorrect');
      } else {
        score++;
      }
      playAnswerSound(isCorrect);
      stopTimer();
      revealBtn.disabled = true;
      nextBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
      sessionIdx++;
      loadQuestion();
    });

    revealBtn.addEventListener('click', revealAnswer);

    function showFinalScore() {
      quizArea.style.display = 'none';
      scoreBox.style.display = 'block';
      finalScoreText.textContent = 'Score: ' + score + ' / ' + session.length;
    }

    restartBtn.addEventListener('click', () => {
      quizArea.style.display = 'block';
      scoreBox.style.display = 'none';
      buildSession();
      loadQuestion();
    });

    /* ---------- independent 30s timer (always startable/stoppable) ---------- */
    let timerInterval = null;
    let timeLeft = 30;

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timeLeft = 30;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('running', 'warning');
      timerBtn.disabled = false;
      timerBtn.textContent = 'Start Timer';
    }

    function startTimer() {
      if (timerInterval !== null) return;
      timeLeft = 30;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('warning');
      timerCircle.classList.add('running');
      timerBtn.disabled = true;
      timerBtn.textContent = 'Running...';

      timerInterval = setInterval(function () {
        timeLeft = timeLeft - 1;
        if (timeLeft <= 0) {
          timerCircle.textContent = '0';
          clearInterval(timerInterval);
          timerInterval = null;
          timerBtn.disabled = false;
          timerBtn.textContent = 'Start Timer';
          timerCircle.classList.remove('running');
          return;
        }
        timerCircle.textContent = timeLeft;
        if (timeLeft <= 10) {
          timerCircle.classList.add('warning');
        }
      }, 1000);
    }

    timerBtn.addEventListener('click', startTimer);

    /* ---------- init ---------- */
    buildSession();
    loadQuestion();
  </script>

</body>
</html>
