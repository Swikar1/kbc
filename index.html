<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBC</title>
<style>
  :root {
    --bg-1: #090d24;
    --bg-2: #1e1434;
    --bg-3: #3a2358;
    --panel: #1e1a38;
    --panel-soft: rgba(72, 51, 93, 0.8);
    --panel-border: rgba(206, 180, 255, 0.18);
    --card-glow: rgba(88, 80, 224, 0.42);
    --text-main: #f7f0ff;
    --text-soft: #d9c3ff;
    --muted: #bca3dc;
    --accent: #69d0ff;
    --accent-2: #4dc3ff;
    --gold: #f4d35e;
    --gold-soft: #d6b53c;
    --purple: #6b4ab1;
    --purple-dark: #362a4b;
    --green: #3ddc97;
    --green-bg: rgba(61, 220, 151, 0.18);
    --green-border: rgba(61, 220, 151, 0.5);
    --red: #ff677d;
    --red-bg: rgba(255, 103, 125, 0.18);
    --red-border: rgba(255, 103, 125, 0.45);
    --border: rgba(255, 255, 255, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
    background: radial-gradient(circle at top, rgba(147, 121, 255, 0.35), transparent 28%), linear-gradient(180deg, #120f22 0%, #23193c 100%);
  }

  .polka-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(180deg, rgba(16, 12, 31, 0.5), rgba(16, 12, 31, 0.7)),
      radial-gradient(circle, rgba(129, 102, 181, 0.22) 1.4px, transparent 1.8px);
    background-position: 0 0, 18px 18px;
    background-size: 36px 36px;
    animation: drift 16s linear infinite;
    filter: blur(0.2px);
  }
  @keyframes drift {
    from { background-position: 0 0, 18px 18px; }
    to   { background-position: 36px 0, 54px 18px; }
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 12px 14px;
  }

  .kbc-logo {
    width: min(100%, 280px);
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    box-shadow: none;
    clip-path: none;
    position: relative;
    z-index: 1;
    overflow: visible;
    padding: 0;
  }

  .kbc-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: transparent;
    filter: drop-shadow(0 0 12px rgba(244, 211, 94, 0.18));
  }

  .card {
    width: min(100%, 400px);
    background: linear-gradient(180deg, #1b1330 0%, #261a42 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    box-shadow: 0 16px 30px rgba(8, 5, 18, 0.62), inset 0 0 0 1px rgba(255,255,255,0.04);
    padding: 12px 10px 10px;
    position: relative;
    overflow: hidden;
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
    pointer-events: none;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1.5px solid rgba(244, 211, 94, 0.7);
    clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
    box-shadow: inset 0 0 12px rgba(244, 211, 94, 0.2), 0 0 18px rgba(244, 211, 94, 0.1);
    pointer-events: none;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    padding: 0 4px;
    position: relative;
    z-index: 1;
  }

  .progress-text {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .progress-bar-track {
    width: 100%;
    height: 5px;
    background: rgba(244, 211, 94, 0.12);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    position: relative;
    z-index: 1;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #7cd4ff, #f4d35e);
    width: 0%;
    transition: width 0.3s ease;
    border-radius: inherit;
  }

  .question-box {
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 800;
    line-height: 1.32;
    padding: 8px 12px 10px;
    color: var(--text-main);
    background: linear-gradient(180deg, rgba(88, 75, 172, 0.5), rgba(87, 70, 160, 0.22));
    border: 1px solid rgba(120, 184, 255, 0.35);
    border-radius: 16px;
    box-shadow: inset 0 0 18px rgba(89, 131, 255, 0.08), 0 0 0 1px rgba(255,255,255,0.02);
    position: relative;
    z-index: 1;
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    border: 1.5px solid rgba(121, 176, 255, 0.4);
    background: linear-gradient(180deg, rgba(77, 74, 123, 0.88), rgba(35, 24, 58, 0.9));
    color: #f5eeff;
    padding: 8px 9px;
    border-radius: 12px;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    min-height: 44px;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }
  .option-btn:hover:not(:disabled) {
    border-color: rgba(244, 211, 94, 0.9);
    box-shadow: 0 0 0 1px rgba(244, 211, 94, 0.18);
  }
  .option-btn:active:not(:disabled) { transform: scale(0.985); }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.74rem;
    font-weight: 800;
    border: 1.5px solid rgba(244, 211, 94, 0.32);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  .option-btn.correct { background: linear-gradient(180deg, rgba(27, 114, 72, 0.7), rgba(14, 70, 46, 0.74)); border-color: var(--green-border); }
  .option-btn.correct .option-letter { background: var(--green); color: #fff; border-color: rgba(255,255,255,0.1); }
  .option-btn.incorrect { background: linear-gradient(180deg, rgba(123, 31, 39, 0.7), rgba(70, 24, 31, 0.8)); border-color: var(--red-border); }
  .option-btn.incorrect .option-letter { background: var(--red); color: #fff; border-color: rgba(255,255,255,0.1); }
  .option-btn.locked {
    background: linear-gradient(135deg, #fdec9a, #f8d663);
    border-color: rgba(196, 138, 16, 0.9);
    color: #3f2a00;
    box-shadow: inset 0 0 0 1px rgba(188, 100, 0, 0.18);
  }
  .option-btn.locked .option-letter {
    background: linear-gradient(180deg, #f5b93d, #d2921c);
    color: #fff;
  }

  .timer-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 10px 0 8px;
    position: relative;
    z-index: 1;
  }

  .timer-circle {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: 4px solid rgba(244, 211, 94, 0.9);
    background: rgba(25, 18, 39, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.5rem;
    color: var(--gold);
    box-shadow: inset 0 0 0 4px rgba(255,255,255,0.03), 0 0 0 1px rgba(255,255,255,0.04);
    transition: border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    clip-path: polygon(50% 0%, 86% 14%, 100% 50%, 86% 86%, 50% 100%, 14% 86%, 0% 50%, 14% 14%);
  }
  .timer-circle.running {
    border-color: rgba(105, 208, 255, 0.9);
    color: #dff8ff;
    box-shadow: 0 0 18px rgba(105, 208, 255, 0.25);
  }
  .timer-circle.warning {
    border-color: rgba(255, 103, 125, 0.9);
    color: #ffd9df;
  }

  .timer-btn {
    border: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
    color: #f9f3ff;
    font-weight: 800;
    letter-spacing: 0.04em;
    font-size: 0.7rem;
    text-transform: uppercase;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  .timer-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .timer-btn:disabled { opacity: 0.55; cursor: default; }

  .btn-next {
    width: 100%;
    border: none;
    background: linear-gradient(180deg, #2bb4ff, #1ea2e8);
    color: #0d1d2c;
    padding: 12px 16px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    transition: filter 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
  }
  .btn-next:active { transform: scale(0.98); }
  .btn-next:hover:not(:disabled) { filter: brightness(1.05); }
  .btn-next:disabled { opacity: 0.5; cursor: default; }

  .option-btn.selected {
    border-color: rgba(105, 208, 255, 0.9);
    background: linear-gradient(180deg, rgba(108, 174, 255, 0.22), rgba(57, 53, 104, 0.88));
    box-shadow: 0 0 0 1px rgba(105, 208, 255, 0.18);
  }

  .lifeline-bar {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
    margin: 0 0 8px;
    position: relative;
    z-index: 1;
  }

  .btn-lock,
  .btn-reveal,
  .btn-fifty,
  .btn-call,
  .btn-poll {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.08);
    background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
    color: #f2f3ff;
    padding: 8px 6px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.72rem;
    cursor: pointer;
    margin-bottom: 8px;
    transition: filter 0.15s ease, opacity 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 38px;
  }

  .lifeline-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(244, 211, 94, 0.2);
    border: 1px solid rgba(244, 211, 94, 0.55);
    font-size: 0.7rem;
    line-height: 1;
    color: var(--gold);
    font-weight: 900;
  }
  .btn-lock:hover:not(:disabled),
  .btn-reveal:hover:not(:disabled),
  .btn-fifty:hover:not(:disabled),
  .btn-call:hover:not(:disabled),
  .btn-poll:hover:not(:disabled) { filter: brightness(1.06); }
  .btn-lock:disabled,
  .btn-reveal:disabled,
  .btn-fifty:disabled,
  .btn-call:disabled,
  .btn-poll:disabled { opacity: 0.5; cursor: default; }

  .status-box {
    background: rgba(23, 17, 36, 0.7);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 7px 8px;
    margin-bottom: 7px;
    color: var(--text-soft);
    font-size: 0.7rem;
    min-height: 42px;
    position: relative;
    z-index: 1;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }

  .status-box strong { display: block; margin-bottom: 4px; color: #fff; }

  .score-box { text-align: center; }
  .score-box h2 { font-size: 1.5rem; margin-bottom: 10px; }
  .score-box p { color: var(--text-soft); margin-bottom: 22px; font-size: 1rem; }

  @media (max-width: 480px) {
    .card { padding: 16px 14px 14px; }
    .options-grid { grid-template-columns: 1fr; }
    .question-box { font-size: 0.98rem; min-height: 74px; }
    .timer-circle { width: 70px; height: 70px; font-size: 1.25rem; }
  }
</style>
<style>
  /* Studio-stage redesign */
  :root {
    --ink: #03051a;
    --midnight: #07103c;
    --royal: #142a82;
    --electric: #62baff;
    --line: #4c9fee;
    --gold: #ffca4f;
    --gold-deep: #d38a14;
    --paper: #fbf7ed;
  }

  html, body { min-height: 100%; }
  body {
    min-width: 320px;
    background: #020319;
    overflow-x: hidden;
  }

  .polka-bg {
    z-index: -2;
    background:
      radial-gradient(ellipse 50% 42% at 50% 53%, rgba(19, 71, 190, .64) 0 2%, rgba(17, 45, 132, .42) 28%, transparent 63%),
      conic-gradient(from 200deg at 50% 50%, #02031a, #0a1460, #030626, #1b2071, #02031a);
    background-size: auto;
    animation: none;
    filter: none;
  }
  .polka-bg::before,
  .polka-bg::after {
    content: "";
    position: absolute;
    left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
  }
  .polka-bg::before {
    width: min(92vw, 1140px); height: min(92vw, 1140px);

    box-shadow: 0 0 0 34px rgba(48, 77, 184, .08), 0 0 0 82px rgba(27, 37, 127, .10), 0 0 100px 32px rgba(22, 93, 255, .24), inset 0 0 90px rgba(95, 163, 255, .25);
  }
  .polka-bg::after {
    width: min(71vw, 850px); height: min(71vw, 850px);
    opacity: .75;
    background: repeating-conic-gradient(from 0deg, rgba(80, 163, 255, .12) 0 2deg, transparent 2deg 15deg);
    -webkit-mask: radial-gradient(transparent 0 30%, #000 31% 63%, transparent 64%);
    mask: radial-gradient(transparent 0 30%, #000 31% 63%, transparent 64%);
  }

  .wrap {
    width: min(100%, 1440px);
    min-height: 100vh;
    padding: 25px clamp(16px, 4vw, 54px) 34px;
    gap: 0;
    justify-content: center;
  }
  .show-header {
    width: 100%;
    min-height: 86px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 20px;
    position: relative;
  }
  .kbc-logo {
    width: 158px;
    height: 74px;
    justify-self: start;
    filter: drop-shadow(0 0 18px rgba(90, 170, 255, .33));
  }
  .kbc-logo img { filter: none; }
  .show-mark { text-align: center; line-height: 1; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 0 18px rgba(83, 173, 255, .55); }
  .show-mark span { display: block; color: #8dcaff; font-size: .6rem; font-weight: 800; letter-spacing: .46em; margin: 0 0 5px .46em; }
  .show-mark strong { color: var(--paper); font-family: Georgia, serif; font-size: clamp(1.25rem, 2.25vw, 2rem); font-weight: 700; letter-spacing: .1em; }
  .show-mark small { display: block; color: var(--gold); font-size: .55rem; letter-spacing: .52em; margin: 7px 0 0 .52em; }
  .host-note { justify-self: end; color: #a5cef7; font-size: .63rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; text-align: right; }
  .host-note b { color: var(--gold); display: block; margin-top: 4px; font-size: .72rem; }

  .game-layout {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    align-items: center;
    gap: clamp(22px, 4vw, 62px);
  }
  .card {
    width: 100%; max-width: none; min-width: 0;
    padding: 0;
    overflow: visible;
    background: transparent; border: none; border-radius: 0; box-shadow: none; clip-path: none;
  }
  .card::before, .card::after { display: none; }
  #quizArea { width: 100%; }
  .card-top {
    width: min(100%, 760px);
    min-height: 42px;
    margin: 0 auto 8px;
    padding: 0 16px;
    border-top: 1px solid rgba(101, 183, 255, .45);
    border-bottom: 1px solid rgba(101, 183, 255, .45);
    background: rgba(4, 12, 55, .67);
  }
  .progress-text, .round-label {
    color: #c4e4ff;
    font-size: .68rem;
    font-weight: 800;
    letter-spacing: .16em;
  }
  .progress-text:last-child { color: var(--gold); }
  .progress-bar-track { width: min(100%, 760px); margin: 0 auto 18px; height: 3px; border: 0; background: rgba(123, 188, 255, .16); }
  .progress-bar-fill { background: #69baff; box-shadow: 0 0 8px rgba(105, 186, 255, .48); }

  .lifeline-bar {
    width: min(100%, 650px);
    margin: 0 auto 18px;
    display: flex;
    justify-content: center;
    gap: clamp(12px, 2vw, 22px);
  }
  .btn-fifty, .btn-call, .btn-poll {
    width: 64px; height: 64px; min-height: 0;
    margin: 0; padding: 4px;
    display: grid; place-items: center;
    border: 2px solid #5eb7ff;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #2454b7, #071550 67%, #020522);
    box-shadow: 0 0 0 3px rgba(28, 93, 188, .25), 0 0 17px rgba(69, 146, 255, .35), inset 0 0 15px rgba(126, 204, 255, .23);
    color: #fff;

  .btn-fifty:hover:not(:disabled), .btn-call:hover:not(:disabled), .btn-poll:hover:not(:disabled) { filter: brightness(1.22); transform: translateY(-2px); }
  .btn-fifty:disabled, .btn-call:disabled, .btn-poll:disabled { opacity: .3; filter: grayscale(1); }
  .lifeline-icon {

    border: 0;
    font-size: 1.05rem;

  .question-box {

    border: 2px solid #66b9fc;

    box-shadow: 0 0 0 3px rgba(15, 39, 126, .75), 0 0 26px rgba(74, 167, 255, .38), inset 0 1px 0 rgba(206, 237, 255, .35);

    text-shadow: 0 2px 3px #01031a;
  }
  .options-grid {
    width: min(100%, 980px);
    margin: 21px auto 0;
    display: grid;

    gap: 15px 31px;
    position: relative;
  }
  .options-grid::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%; width: 100%; height: 1px;
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, transparent, rgba(84, 173, 255, .44) 12%, rgba(84, 173, 255, .44) 88%, transparent);
    z-index: -1;
  }
  .option-btn {
    min-height: 59px;
    gap: 12px;
    padding: 10px 25px 10px 37px;
    border: 2px solid #3f9bed;

    background: linear-gradient(90deg, rgba(7, 28, 100, .99), rgba(16, 63, 154, .95), rgba(7, 28, 100, .99));
    box-shadow: inset 0 1px 0 rgba(217, 241, 255, .2), 0 0 14px rgba(32, 113, 219, .18);
    clip-path: polygon(0 50%, 5.5% 0, 94.5% 0, 100% 50%, 94.5% 100%, 5.5% 100%);
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(.82rem, 1.35vw, 1rem);
    font-weight: 600;
    line-height: 1.2;
  }
  .option-btn::before { content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 2px; background: linear-gradient(90deg, transparent, rgba(215, 243, 255, .55), transparent); }
  .option-btn:hover:not(:disabled) { border-color: #f8c957; box-shadow: 0 0 19px rgba(255, 193, 49, .35), inset 0 1px 0 rgba(255, 247, 209, .45); }
  .option-letter { width: auto; height: auto; border: 0; border-radius: 0; background: transparent; box-shadow: none; color: #f9c74c; font-family: Arial, sans-serif; font-size: .86em; }

<body>

  <div class="polka-bg" id="polkaBg"></div>

  <div class="wrap">
    <header class="show-header">
      <div class="kbc-logo" aria-label="KBC logo">
        <img src="./kbc-logo-transparent.png" alt="KBC logo" />
      </div>
      <p class="game-caption">General Knowledge Quiz</p>
    </header>

    <main class="game-layout">
      <div class="card">
        <div id="quizArea">
          <div class="card-top">
            <span class="progress-text" id="progressText">1 / 15</span>
            <span class="progress-text" id="tierText">Round 1</span>
          </div>
          <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>

          <div class="lifeline-bar" aria-label="Lifelines">
            <button class="btn-fifty" id="fiftyBtn" aria-label="Use 50-50 lifeline"><span class="lifeline-icon">50</span><span>50–50</span></button>
            <button class="btn-call" id="callBtn" aria-label="Call a friend"><span class="lifeline-icon">☎</span><span>Phone</span></button>
            <button class="btn-poll" id="pollBtn" aria-label="Ask the audience"><span class="lifeline-icon">◔</span><span>Audience</span></button>
          </div>

          <div class="question-box" id="questionBox"></div>
          <div class="options-grid" id="optionsGrid"></div>

          <div class="timer-row">
            <div class="timer-circle" id="timerCircle">32</div>
            <button class="timer-btn" id="timerBtn">Start Timer</button>
          </div>

          <div class="answer-actions">
            <button class="btn-lock" id="lockBtn" disabled>Lock Answer</button>
            <button class="btn-reveal" id="revealBtn" disabled>Reveal Answer</button>
            <button class="btn-next" id="nextBtn" disabled>Next Question</button>
          </div>

          <div class="status-box" id="lifelineStatus">
            <strong>Lifelines</strong>Select an answer when you are ready.
          </div>
        </div>

        <div class="score-box" id="scoreBox" style="display:none;">
          <h2>Game Complete</h2>
          <p id="finalScoreText"></p>
          <button class="btn-next" id="restartBtn">Play Again</button>
        </div>
      </div>

    </main>
  </div>

  <section class="lifeline-modal" id="lifelineModal" aria-modal="true" aria-labelledby="lifelineModalTitle" hidden>
    <div class="lifeline-modal-card" role="dialog">
      <button class="modal-close" id="lifelineCloseBtn" aria-label="Close lifeline">×</button>
      <div class="lifeline-modal-icon" id="lifelineModalIcon">☎</div>
      <p class="lifeline-modal-kicker" id="lifelineModalKicker">Lifeline</p>
      <h2 id="lifelineModalTitle">Phone a Friend</h2>
      <div class="lifeline-modal-content" id="lifelineModalContent"></div>
      <button class="modal-done" id="lifelineDoneBtn">Back to question</button>
    </div>
  </section>

  <script>
    /* ---------- quiz data ---------- */
    const GENERAL_KNOWLEDGE_BANK = [
      ["Who was the first president of the United States?", ["George Washington", "John Adams", "Thomas Jefferson", "James Madison"]],
      ["What is the capital city of Canada?", ["Ottawa", "Toronto", "Montreal", "Vancouver"]],
      ["Which empire built Machu Picchu?", ["Inca Empire", "Roman Empire", "Ottoman Empire", "Mughal Empire"]],
      ["Who painted the Mona Lisa?", ["Leonardo da Vinci", "Vincent van Gogh", "Pablo Picasso", "Michelangelo"]],
      ["Which ocean lies between Africa and Australia?", ["Indian Ocean", "Atlantic Ocean", "Pacific Ocean", "Arctic Ocean"]],
      ["Who wrote 'Pride and Prejudice'?", ["Jane Austen", "Charlotte Brontë", "Mary Shelley", "George Eliot"]],
      ["Which country hosted the 2016 Summer Olympics?", ["Brazil", "China", "United Kingdom", "Japan"]],

      oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);

        oscillator.frequency.exponentialRampToValueAtTime(sweepTo, ctx.currentTime + duration);
      }

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(volume || 0.12, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + duration + 0.02);
      oscillator.onended = () => ctx.close();
    }

    function playAnswerSound(isCorrect) {
      const isFinalQuestion = sessionIdx === session.length - 1;

      if (isFinalQuestion && isCorrect) {
        finalQuestionAudio.pause();
        finalQuestionAudio.currentTime = 0;
        finalQuestionAudio.volume = 1;
        finalQuestionAudio.play().catch(() => {});
        return;
      }

      if (isCorrect) {
        playTone({ frequency: 660, duration: 0.23, type: 'triangle', volume: 0.12, sweepTo: 880 });
        return;
      }

      playTone({ frequency: 220, duration: 0.25, type: 'sawtooth', volume: 0.09, sweepTo: 120 });
    }

    const BONUS_HARD_QUESTIONS = [
      { q: 'Which process in cellular respiration produces the most ATP?', options: ['Glycolysis', 'Krebs cycle', 'Electron transport chain', 'Fermentation'], correct: 'C', tier: 10 },
      { q: 'In evolutionary biology, what is the term for structures with a common ancestry but different functions?', options: ['Analogous structures', 'Homologous structures', 'Vestigial structures', 'Adaptive structures'], correct: 'B', tier: 10 },
      { q: 'Which of these is the largest prime factor of 1,024?', options: ['2', '3', '5', '17'], correct: 'A', tier: 10 },
      { q: 'Who developed the theory of general relativity?', options: ['Isaac Newton', 'Albert Einstein', 'Nikola Tesla', 'Stephen Hawking'], correct: 'B', tier: 10 },
      { q: 'Which part of the human brain is primarily responsible for balance and coordination?', options: ['Cerebrum', 'Cerebellum', 'Medulla oblongata', 'Hypothalamus'], correct: 'B', tier: 10 }
    ];

    function buildSession() {
      // Re-roll the seed pools each time so restarts pull fresh variety
      // from the much larger question bank instead of the same fixed subset.
      QUIZ_DATA = buildQuestionPools();
      // true progressive difficulty: tier 1 to tier 10 in order, then five added tougher questions at the end
      const regularQuestions = QUIZ_DATA.map((tierObj, index) => {
        const q = shuffle(tierObj.questions)[0];
        return Object.assign({ tier: index + 1 }, q);
      });
      session = regularQuestions.concat(BONUS_HARD_QUESTIONS.map(item => ({
        q: item.q,
        options: item.options,
        correct: item.correct,
        answer_text: item.options[0],
        tier: item.tier
      })));
      sessionIdx = 0;
      score = 0;
      fiftyUsed = false;
      callUsed = false;
      pollUsed = false;
    }

    const progressText = document.getElementById('progressText');
    const tierText = document.getElementById('tierText');
    const progressFill = document.getElementById('progressFill');
    const questionBox = document.getElementById('questionBox');
    const optionsGrid = document.getElementById('optionsGrid');
    const revealBtn = document.getElementById('revealBtn');
    const lockBtn = document.getElementById('lockBtn');
    const fiftyBtn = document.getElementById('fiftyBtn');
    const callBtn = document.getElementById('callBtn');
    const pollBtn = document.getElementById('pollBtn');
    const lifelineStatus = document.getElementById('lifelineStatus');
    const nextBtn = document.getElementById('nextBtn');
    const quizArea = document.getElementById('quizArea');
    const scoreBox = document.getElementById('scoreBox');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const timerBtn = document.getElementById('timerBtn');
    const timerCircle = document.getElementById('timerCircle');
    const lifelineModal = document.getElementById('lifelineModal');
    const lifelineModalIcon = document.getElementById('lifelineModalIcon');
    const lifelineModalKicker = document.getElementById('lifelineModalKicker');
    const lifelineModalTitle = document.getElementById('lifelineModalTitle');
    const lifelineModalContent = document.getElementById('lifelineModalContent');
    const lifelineCloseBtn = document.getElementById('lifelineCloseBtn');
    const lifelineDoneBtn = document.getElementById('lifelineDoneBtn');
    const questionIntroAudio = new Audio('./' + encodeURIComponent('Kbc question opening mp3 [6Nmm63pN5sA].mp3'));
    const tickAudio = new Audio('./' + encodeURIComponent('30 second tic tic kbc clock [6BvpEAGNGHg].mp3'));
    let audioUnlocked = false;

    function getAvailableOptionButtons() {
      return [...optionsGrid.children].filter(btn => btn.style.visibility !== 'hidden');
    }

    function openLifelineModal({ icon, kicker, title, content }) {
      lifelineModalIcon.textContent = icon;
      lifelineModalKicker.textContent = kicker;
      lifelineModalTitle.textContent = title;
      lifelineModalContent.innerHTML = content;
      lifelineModal.hidden = false;
      lifelineDoneBtn.focus();
    }

    function closeLifelineModal() {
      lifelineModal.hidden = true;
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      questionIntroAudio.muted = false;
      tickAudio.muted = false;
      questionIntroAudio.volume = 1;
      tickAudio.volume = 0.8;
    }

    function playQuestionIntro() {
      unlockAudio();
      questionIntroAudio.pause();
      questionIntroAudio.currentTime = 0;
      questionIntroAudio.play().catch(() => {});
    }

    function playTickSound() {
      unlockAudio();
      tickAudio.pause();
      tickAudio.currentTime = 0;
      tickAudio.loop = true;
      tickAudio.play().catch(() => {});
    }

    function stopTickSound() {
      try {
        tickAudio.pause();
        tickAudio.currentTime = 0;
        tickAudio.loop = false;
      } catch (error) {
        // ignore when audio is unavailable
      }
    }

    function loadQuestion() {
      if (sessionIdx >= session.length) {
        showFinalScore();
        return;
      }
      stopTimer();
      closeLifelineModal();
      selectedLetter = null;
      answerLocked = false;
      revealBtn.disabled = true;
      lockBtn.disabled = true;
      fiftyBtn.disabled = fiftyUsed;
      callBtn.disabled = callUsed;
      pollBtn.disabled = pollUsed;
      lifelineStatus.innerHTML = '<strong>Lifelines</strong>Select an answer when you are ready.';
      nextBtn.disabled = true;

      const item = session[sessionIdx];
      progressText.textContent = (sessionIdx + 1) + ' / ' + session.length;
      tierText.textContent = 'Round ' + (sessionIdx + 1);
      progressFill.style.width = ((sessionIdx + 1) / session.length * 100) + '%';
      questionBox.textContent = item.q;
      playQuestionIntro();

      const baseLetters = ['A','B','C','D'];
      currentCorrectLetter = item.correct;

      optionsGrid.innerHTML = '';
      item.options.forEach((opt, i) => {
        const letter = baseLetters[i];
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.letter = letter;
        btn.innerHTML = '<span class="option-letter">' + letter + '</span><span>' + opt + '</span>';
        btn.addEventListener('click', () => selectOption(letter, btn));
        optionsGrid.appendChild(btn);
      });
    }

    function useFiftyFifty() {
      if (fiftyUsed || answerLocked) return;

      const allBtns = [...optionsGrid.children];
      if (allBtns.length === 0) return;

      const wrongLetters = allBtns
        .map(b => b.dataset.letter)
        .filter(letter => letter !== currentCorrectLetter && letter !== selectedLetter);

      if (wrongLetters.length < 2) return;

      const toRemove = shuffle(wrongLetters).slice(0, 2);
      allBtns.forEach(btn => {
        const shouldHide = toRemove.includes(btn.dataset.letter);
        btn.disabled = shouldHide;
        btn.style.visibility = shouldHide ? 'hidden' : 'visible';
        btn.style.pointerEvents = shouldHide ? 'none' : 'auto';
      });

      fiftyUsed = true;
      fiftyBtn.disabled = true;
      lifelineStatus.innerHTML = '<strong>50-50</strong>Two wrong answers were removed.';
    }

    function useCallFriend() {
      if (callUsed || answerLocked) return;

      const choices = getAvailableOptionButtons();
      const currentTier = Number((session[sessionIdx] && session[sessionIdx].tier) || 1);
      const correctChoice = choices.find(btn => btn.dataset.letter === currentCorrectLetter);
      const incorrectChoices = choices.filter(btn => btn !== correctChoice);
      if (!correctChoice || !incorrectChoices.length) return;

      // A local, intentionally imperfect helper: accuracy declines with difficulty,
      // then a little random variation keeps repeat plays from feeling scripted.
      const accuracy = Math.max(0.31, Math.min(0.72, 0.72 - (currentTier - 1) * 0.04 + (Math.random() - 0.5) * 0.14));
      const getsItRight = Math.random() < accuracy;
      const recommendation = getsItRight
        ? correctChoice
        : incorrectChoices[Math.floor(Math.random() * incorrectChoices.length)];
      const confidence = Math.round(getsItRight
        ? Math.max(48, Math.min(78, accuracy * 100 + 10 + Math.random() * 9))
        : 34 + Math.random() * 21);
      const friendNames = ['Aarav', 'Maya', 'Rohan', 'Anika', 'Kabir', 'Priya'];
      const friendName = friendNames[Math.floor(Math.random() * friendNames.length)];
      const answerText = recommendation.querySelector('span:last-child').textContent;

      callUsed = true;
      callBtn.disabled = true;
      lifelineStatus.innerHTML = '<strong>Phone a Friend</strong>' + friendName + ' has shared a cautious opinion.';
      openLifelineModal({
        icon: '☎',
        kicker: 'Phone a Friend',
        title: 'Connecting…',
        content: '<p class="friend-call-status">Calling ' + friendName + ' for a quick second opinion</p>'
      });

      window.setTimeout(() => {
        if (lifelineModal.hidden) return;
        lifelineModalTitle.textContent = friendName + ' is on the line';
        lifelineModalContent.innerHTML =
          '<p class="friend-call-status">"I only have a hunch, so do not follow me blindly."</p>' +
          '<p class="friend-name">' + friendName + '</p>' +
          '<p class="friend-message">I would lean toward <strong>' + recommendation.dataset.letter + '. ' + answerText + '</strong>. It feels like the best fit, but I may be overthinking it.</p>' +
          '<p class="friend-confidence">Personal confidence: ' + confidence + '%</p>';
      }, 500);
    }

    function useAudiencePoll() {
      if (pollUsed || answerLocked) return;

      const choices = getAvailableOptionButtons();
      const currentTier = Number((session[sessionIdx] && session[sessionIdx].tier) || 1);
      const correctChoice = choices.find(btn => btn.dataset.letter === currentCorrectLetter);
      const incorrectChoices = choices.filter(btn => btn !== correctChoice);
      if (!correctChoice || !incorrectChoices.length) return;

      // Early questions draw a clearer consensus. Later questions deliberately
      // produce a noisier room, so the poll remains useful but never certain.
      const audienceLean = Math.max(0.28, Math.min(0.82,
        0.75 - (currentTier - 1) * 0.042 + (Math.random() - 0.5) * 0.16 + (choices.length === 2 ? 0.08 : 0)
      ));
      const distractorWeights = incorrectChoices.map(() => 0.35 + Math.random() * 0.9);
      const distractorTotal = distractorWeights.reduce((sum, weight) => sum + weight, 0);
      const correctWeight = audienceLean / (1 - audienceLean) * distractorTotal;
      const rawResults = choices.map(choice => ({
        choice,
        weight: choice === correctChoice
          ? correctWeight
          : distractorWeights[incorrectChoices.indexOf(choice)]
      }));
      const weightTotal = rawResults.reduce((sum, result) => sum + result.weight, 0);
      const result = rawResults.map(item => ({
        choice: item.choice,
        percent: Math.floor(item.weight / weightTotal * 100)
      }));
      const allocated = result.reduce((sum, item) => sum + item.percent, 0);
      result.sort((a, b) => b.percent - a.percent)[0].percent += 100 - allocated;

      pollUsed = true;
      pollBtn.disabled = true;
      lifelineStatus.innerHTML = '<strong>Audience Poll</strong>The audience has cast its vote.';
      openLifelineModal({
        icon: '◔',
        kicker: 'Ask the Audience',
        title: 'Audience vote',
        content: '<p class="audience-note">The room has voted. The crowd can still be wrong.</p>' +
          result.map(item =>
            '<div class="poll-result"><span class="poll-letter">' + item.choice.dataset.letter +
            '</span><div class="poll-track"><div class="poll-fill" data-percent="' + item.percent +
            '"></div></div><span class="poll-percent">' + item.percent + '%</span></div>'
          ).join('')
      });
      window.setTimeout(() => {
        lifelineModalContent.querySelectorAll('.poll-fill').forEach(bar => {
          bar.style.width = bar.dataset.percent + '%';
        });
      }, 30);
    }

    function revealAnswer() {
      const allBtns = [...optionsGrid.children];
      if (!allBtns.length) return;
      if (!answerLocked || !selectedLetter) return;

      const correctBtn = allBtns.find(b => b.dataset.letter === currentCorrectLetter);
      const selectedBtn = allBtns.find(b => b.dataset.letter === selectedLetter);
      const isCorrect = selectedLetter === currentCorrectLetter;

      if (selectedBtn) selectedBtn.classList.remove('locked');
      allBtns.forEach(b => b.disabled = true);
      if (correctBtn) correctBtn.classList.add('correct');
      if (selectedBtn && !isCorrect) {
        selectedBtn.classList.add('incorrect');
      }

      revealBtn.disabled = true;
      if (isCorrect) {
        score++;
        nextBtn.disabled = false;
      } else {
        nextBtn.disabled = true;
        setTimeout(() => {
          sessionIdx = session.length;
          showFinalScore();
        }, 700);
      }
      playAnswerSound(isCorrect);
      stopTimer();
    }

    function lockAnswer() {
      if (answerLocked || !selectedLetter) return;

      const allBtns = [...optionsGrid.children];
      if (!allBtns.length) return;

      const selectedBtn = allBtns.find(b => b.dataset.letter === selectedLetter);
      allBtns.forEach(b => b.disabled = true);
      if (selectedBtn) {
        selectedBtn.classList.add('locked');
        selectedBtn.classList.remove('selected');
      }
      answerLocked = true;
      lockBtn.disabled = true;
      revealBtn.disabled = false;
      fiftyBtn.disabled = true;
      callBtn.disabled = true;
      pollBtn.disabled = true;
    }

    function selectOption(letter, btnEl) {
      const allBtns = [...optionsGrid.children];
      if (answerLocked || btnEl.disabled || btnEl.style.visibility === 'hidden') return;

      selectedLetter = letter;
      allBtns.forEach(b => {
        if (b !== btnEl) b.classList.remove('selected');
      });
      btnEl.classList.add('selected');
      lockBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
      sessionIdx++;
      loadQuestion();
    });

    revealBtn.addEventListener('click', revealAnswer);
    lockBtn.addEventListener('click', lockAnswer);
    fiftyBtn.addEventListener('click', useFiftyFifty);
    callBtn.addEventListener('click', useCallFriend);
    pollBtn.addEventListener('click', useAudiencePoll);
    lifelineCloseBtn.addEventListener('click', closeLifelineModal);
    lifelineDoneBtn.addEventListener('click', closeLifelineModal);
    lifelineModal.addEventListener('click', event => {
      if (event.target === lifelineModal) closeLifelineModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !lifelineModal.hidden) closeLifelineModal();
    });

    function showFinalScore() {
      closeLifelineModal();
      quizArea.style.display = 'none';
      scoreBox.style.display = 'block';
      finalScoreText.textContent = 'You answered ' + score + ' of ' + session.length + ' questions correctly.';
    }

    restartBtn.addEventListener('click', () => {
      quizArea.style.display = 'block';
      scoreBox.style.display = 'none';
      buildSession();
      loadQuestion();
    });

    /* ---------- independent 32s timer (always startable/stoppable) ---------- */
    let timerInterval = null;
    let timeLeft = 32;

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      stopTickSound();
      timeLeft = 32;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('running', 'warning');
      timerBtn.disabled = false;
      timerBtn.textContent = 'Start Timer';
    }

    function startTimer() {
      if (timerInterval !== null) return;
      unlockAudio();
      playTickSound();
      timeLeft = 32;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('warning');
      timerCircle.classList.add('running');
      timerBtn.disabled = true;
      timerBtn.textContent = 'Running...';

      timerInterval = setInterval(function () {
        timeLeft = timeLeft - 1;
        if (timeLeft <= 0) {
          timerCircle.textContent = '0';
          clearInterval(timerInterval);
          timerInterval = null;
          stopTickSound();
          timerBtn.disabled = false;
          timerBtn.textContent = 'Start Timer';
          timerCircle.classList.remove('running');
          return;
        }
        timerCircle.textContent = timeLeft;
        if (timeLeft <= 10) {
          timerCircle.classList.add('warning');
        }
      }, 1000);
    }

    timerBtn.addEventListener('click', () => {
      unlockAudio();
      startTimer();
    });
    document.addEventListener('pointerdown', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });
    optionsGrid.addEventListener('click', unlockAudio, { capture: true });

    /* ---------- init ---------- */
    buildSession();
    loadQuestion();
  </script>

</body>
</html>
