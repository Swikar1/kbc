<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KBC</title>
<style>
  :root {
    --bg-color: #ffffff;
    --dot-color: #2563eb;
    --tile-size: 250px;
    --text-main: #1e293b;
    --text-sub: #94a3b8;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --red: #ef4444;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --border: #e2e8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }

  .polka-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #f8fbff;
    background-image: radial-gradient(circle, rgba(37, 99, 235, 0.9) 1.6px, transparent 1.9px),
                      radial-gradient(circle, rgba(147, 197, 253, 0.9) 1.6px, transparent 1.9px);
    background-position: 0 0, 17px 17px;
    background-size: 34px 34px;
    background-repeat: repeat;
    animation: drift 18s linear infinite;
  }
  @keyframes drift {
    from { background-position: 0 0, 17px 17px; }
    to   { background-position: 34px 0, 51px 17px; }
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 22px;
    box-shadow: 0 12px 44px rgba(30,41,59,0.14);
    padding: 30px 28px;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .progress-text {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-sub);
    letter-spacing: 0.02em;
  }

  .progress-bar-track {
    width: 100%;
    height: 5px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .question-box {
    min-height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.5;
    padding: 4px 4px 24px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text-main);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); }
  .option-btn:active:not(:disabled) { transform: scale(0.98); }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: #f1f5f9;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .option-btn.correct { background: var(--green-bg); border-color: var(--green-border); color: #166534; }
  .option-btn.correct .option-letter { background: var(--green); color: #fff; }
  .option-btn.incorrect { background: var(--red-bg); border-color: var(--red-border); color: #991b1b; }
  .option-btn.incorrect .option-letter { background: var(--red); color: #fff; }
  .option-btn.locked {
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border-color: #f59e0b;
    color: #78350f;
    box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.25);
  }
  .option-btn.locked .option-letter {
    background: #f59e0b;
    color: #fff;
  }

  .timer-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .timer-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 3px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text-main);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .timer-circle.running { border-color: var(--accent); color: var(--accent-dark); }
  .timer-circle.warning { border-color: var(--red); color: var(--red); }

  .timer-btn {
    border: none;
    background: #f1f5f9;
    color: var(--text-main);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .timer-btn:hover:not(:disabled) { filter: brightness(0.95); }
  .timer-btn:disabled { opacity: 0.55; cursor: default; }

  .btn-next {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 13px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
  }
  .btn-next:active { transform: scale(0.98); }
  .btn-next:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-next:disabled { opacity: 0.5; cursor: default; }

  .option-btn.selected {
    border-color: var(--accent);
    background: rgba(37,99,235,0.04);
    box-shadow: inset 0 0 0 1px rgba(37,99,235,0.08);
  }

  .lifeline-bar {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }

  .btn-lock,
  .btn-reveal,
  .btn-fifty,
  .btn-call,
  .btn-poll {
    width: 100%;
    border: 1px solid rgba(37,99,235,0.35);
    background: rgba(37,99,235,0.08);
    color: var(--accent-dark);
    padding: 11px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 10px;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }
  .btn-lock:hover:not(:disabled),
  .btn-reveal:hover:not(:disabled),
  .btn-fifty:hover:not(:disabled),
  .btn-call:hover:not(:disabled),
  .btn-poll:hover:not(:disabled) { filter: brightness(0.98); }
  .btn-lock:disabled,
  .btn-reveal:disabled,
  .btn-fifty:disabled,
  .btn-call:disabled,
  .btn-poll:disabled { opacity: 0.5; cursor: default; }

  .status-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
    color: var(--text-main);
    font-size: 0.8rem;
    min-height: 58px;
  }

  .status-box strong { display: block; margin-bottom: 4px; }

  .score-box { text-align: center; }
  .score-box h2 { font-size: 1.5rem; margin-bottom: 10px; }
  .score-box p { color: var(--text-sub); margin-bottom: 22px; font-size: 1rem; }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
    .options-grid { grid-template-columns: 1fr; }
    .question-box { font-size: 1.05rem; min-height: 70px; }
  }
</style>
</head>

  <div class="polka-bg" id="polkaBg"></div>

        <div class="timer-row">

          <button class="timer-btn" id="timerBtn">Start Timer</button>
        </div>

        <div class="lifeline-bar">

          <button class="btn-call" id="callBtn">Call a Friend</button>
          <button class="btn-poll" id="pollBtn">Audience Poll</button>
        </div>

        <div class="status-box" id="lifelineStatus">

        </div>

        <button class="btn-lock" id="lockBtn" disabled>Lock Answer</button>
        <button class="btn-reveal" id="revealBtn" disabled>Reveal Answer</button>
        <button class="btn-next" id="nextBtn" disabled>Next</button>
      </div>

      <div class="score-box" id="scoreBox" style="display:none;">
        <h2>Done!</h2>
        <p id="finalScoreText"></p>
        <button class="btn-next" id="restartBtn">New Quiz</button>

        ["A bag has 6 balls, 5 of which are red. What is the probability of drawing a red ball?", ["5/6", "5/6", "6/6", "1/6"]],
        ["A bag has 6 balls, 1 of which are red. What is the probability of drawing a red ball?", ["1/6", "1/6", "2/6", "5/6"]],

        ["A bag has 6 balls, 1 of which are red. What is the probability of drawing a red ball?", ["1/6", "1/6", "2/6", "5/6"]]
      ]
    };

    const GRADE_BANKS = [GRADE_8_BANK, GRADE_9_BANK, GRADE_10_BANK, GRADE_11_BANK, GRADE_12_BANK];
    const QUESTION_SEEDS = Array.from({ length: 10 }, (_, tierIndex) => {
      const gradeBank = GRADE_BANKS[Math.floor(tierIndex / 2)];
      const general = shuffle([...gradeBank.general]).slice(0, Math.min(30, gradeBank.general.length));
      const science = shuffle([...gradeBank.science]).slice(0, Math.min(10, gradeBank.science.length));
      return [...general, ...science];
    });

    function createQuestion(text, options, variant) {
      const offset = variant % options.length;
      const rotated = options.slice(offset).concat(options.slice(0, offset));
      const correctIndex = (options.length - offset) % options.length;
      return { q: text, options: rotated, correct: ['A', 'B', 'C', 'D'][correctIndex], answer_text: options[0] };
    }

    function buildQuestionPools() {
      const harderSeedSets = QUESTION_SEEDS.map((seeds, tierIndex) => {
        const difficultyBoost = tierIndex + 1;
        return {
          tier: tierIndex + 1,
          questions: Array.from({ length: 500 }, (_, index) => {
            const baseIndex = (index * (difficultyBoost + 3) + tierIndex * 7) % seeds.length;
            const seed = seeds[baseIndex];
            return createQuestion(seed[0], seed[1], index + difficultyBoost * 11 + tierIndex * 5);
          })
        };
      });

      return harderSeedSets;
    }

    let QUIZ_DATA = buildQuestionPools();
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let session = [];
    let sessionIdx = 0;
    let score = 0;
    let currentCorrectLetter = 'A';
    let selectedLetter = null;
    let answerLocked = false;
    let fiftyUsed = false;
    let callUsed = false;
    let pollUsed = false;
    const finalQuestionAudio = new Audio('./' + encodeURIComponent('7 CRORE KBC - SOUND EFFECT [fl6xbIdBSic].mp3'));

    function playTone({ frequency, duration, type, volume, sweepTo }) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const ctx = new AudioCtx();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = type || 'sine';
      oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);
      if (sweepTo) {
        oscillator.frequency.exponentialRampToValueAtTime(sweepTo, ctx.currentTime + duration);
      }

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(volume || 0.12, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + duration + 0.02);
      oscillator.onended = () => ctx.close();
    }

    function playAnswerSound(isCorrect) {
      const isFinalQuestion = sessionIdx === session.length - 1;

      if (isFinalQuestion && isCorrect) {
        finalQuestionAudio.pause();
        finalQuestionAudio.currentTime = 0;
        finalQuestionAudio.volume = 1;
        finalQuestionAudio.play().catch(() => {});
        return;
      }

      if (isCorrect) {
        playTone({ frequency: 660, duration: 0.23, type: 'triangle', volume: 0.12, sweepTo: 880 });
        return;
      }

      playTone({ frequency: 220, duration: 0.25, type: 'sawtooth', volume: 0.09, sweepTo: 120 });
    }

    const BONUS_HARD_QUESTIONS = [
      { q: 'Which process in cellular respiration produces the most ATP?', options: ['Glycolysis', 'Krebs cycle', 'Electron transport chain', 'Fermentation'], correct: 'C', tier: 10 },
      { q: 'In evolutionary biology, what is the term for structures with a common ancestry but different functions?', options: ['Analogous structures', 'Homologous structures', 'Vestigial structures', 'Adaptive structures'], correct: 'B', tier: 10 },
      { q: 'Which of these is the largest prime factor of 1,024?', options: ['2', '3', '5', '17'], correct: 'A', tier: 10 },
      { q: 'Who developed the theory of general relativity?', options: ['Isaac Newton', 'Albert Einstein', 'Nikola Tesla', 'Stephen Hawking'], correct: 'B', tier: 10 },
      { q: 'Which part of the human brain is primarily responsible for balance and coordination?', options: ['Cerebrum', 'Cerebellum', 'Medulla oblongata', 'Hypothalamus'], correct: 'B', tier: 10 }
    ];

    function buildSession() {
      // Re-roll the seed pools each time so restarts pull fresh variety
      // from the much larger question bank instead of the same fixed subset.
      QUIZ_DATA = buildQuestionPools();
      // true progressive difficulty: tier 1 to tier 10 in order, then five added tougher questions at the end
      const regularQuestions = QUIZ_DATA.map((tierObj, index) => {
        const q = shuffle(tierObj.questions)[0];
        return Object.assign({ tier: index + 1 }, q);
      });
      session = regularQuestions.concat(BONUS_HARD_QUESTIONS.map(item => ({
        q: item.q,
        options: item.options,
        correct: item.correct,
        answer_text: item.options[0],
        tier: item.tier
      })));
      sessionIdx = 0;
      score = 0;
      fiftyUsed = false;
      callUsed = false;
      pollUsed = false;
    }

    const progressText = document.getElementById('progressText');
    const tierText = document.getElementById('tierText');
    const progressFill = document.getElementById('progressFill');
    const questionBox = document.getElementById('questionBox');
    const optionsGrid = document.getElementById('optionsGrid');
    const revealBtn = document.getElementById('revealBtn');
    const lockBtn = document.getElementById('lockBtn');
    const fiftyBtn = document.getElementById('fiftyBtn');
    const callBtn = document.getElementById('callBtn');
    const pollBtn = document.getElementById('pollBtn');
    const lifelineStatus = document.getElementById('lifelineStatus');
    const nextBtn = document.getElementById('nextBtn');
    const quizArea = document.getElementById('quizArea');
    const scoreBox = document.getElementById('scoreBox');
    const finalScoreText = document.getElementById('finalScoreText');
    const restartBtn = document.getElementById('restartBtn');
    const timerBtn = document.getElementById('timerBtn');
    const timerCircle = document.getElementById('timerCircle');
    const questionIntroAudio = new Audio('./' + encodeURIComponent('Kbc question opening mp3 [6Nmm63pN5sA].mp3'));
    const tickAudio = new Audio('./' + encodeURIComponent('30 second tic tic kbc clock [6BvpEAGNGHg].mp3'));
    let audioUnlocked = false;

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      questionIntroAudio.muted = false;
      tickAudio.muted = false;
      questionIntroAudio.volume = 1;
      tickAudio.volume = 0.8;
    }

    function playQuestionIntro() {
      unlockAudio();
      questionIntroAudio.pause();
      questionIntroAudio.currentTime = 0;
      questionIntroAudio.play().catch(() => {});
    }

    function playTickSound() {
      unlockAudio();
      tickAudio.pause();
      tickAudio.currentTime = 0;
      tickAudio.loop = true;
      tickAudio.play().catch(() => {});
    }

    function stopTickSound() {
      try {
        tickAudio.pause();
        tickAudio.currentTime = 0;
        tickAudio.loop = false;
      } catch (error) {
        // ignore when audio is unavailable
      }
    }

    function loadQuestion() {
      if (sessionIdx >= session.length) {
        showFinalScore();
        return;
      }
      stopTimer();
      selectedLetter = null;
      answerLocked = false;
      revealBtn.disabled = true;
      lockBtn.disabled = true;
      fiftyBtn.disabled = fiftyUsed;
      callBtn.disabled = callUsed;
      pollBtn.disabled = pollUsed;
      lifelineStatus.innerHTML = '<strong>Lifelines</strong>';
      nextBtn.disabled = true;

      const item = session[sessionIdx];
      progressText.textContent = (sessionIdx + 1) + ' / ' + session.length;
      tierText.textContent = 'Tier ' + item.tier;
      progressFill.style.width = (sessionIdx / session.length * 100) + '%';
      questionBox.textContent = item.q;
      playQuestionIntro();

      const baseLetters = ['A','B','C','D'];
      currentCorrectLetter = item.correct;

      optionsGrid.innerHTML = '';
      item.options.forEach((opt, i) => {
        const letter = baseLetters[i];
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.letter = letter;
        btn.innerHTML = '<span class="option-letter">' + letter + '</span><span>' + opt + '</span>';
        btn.addEventListener('click', () => selectOption(letter, btn));
        optionsGrid.appendChild(btn);
      });
    }

    function useFiftyFifty() {
      if (fiftyUsed) return;

      const allBtns = [...optionsGrid.children];
      if (allBtns.length === 0) return;

      const wrongLetters = allBtns
        .map(b => b.dataset.letter)
        .filter(letter => letter !== currentCorrectLetter && letter !== selectedLetter);

      if (wrongLetters.length < 2) return;

      const toRemove = shuffle(wrongLetters).slice(0, 2);
      allBtns.forEach(btn => {
        const shouldHide = toRemove.includes(btn.dataset.letter);
        btn.disabled = shouldHide;
        btn.style.visibility = shouldHide ? 'hidden' : 'visible';
        btn.style.pointerEvents = shouldHide ? 'none' : 'auto';
      });

      fiftyUsed = true;
      fiftyBtn.disabled = true;
      lifelineStatus.innerHTML = '<strong>50-50</strong>Two wrong answers were removed.';
    }

    function useCallFriend() {
      if (callUsed) return;

      const currentTier = Number((session[sessionIdx] && session[sessionIdx].tier) || 1);
      const letters = ['A', 'B', 'C', 'D'];
      const weighted = letters.map(letter => {
        const isCorrect = letter === currentCorrectLetter;
        let weight = isCorrect ? 0.42 : 0.18;

        if (selectedLetter && letter === selectedLetter) {
          weight = isCorrect ? 0.48 : 0.24;
        }

        if (currentTier <= 5) {
          weight -= isCorrect ? 0.18 : 0.06;
        }

        if (!isCorrect && letter !== selectedLetter) {
          weight += Math.random() * 0.18;
        }

        return { letter, weight };
      });

      const best = weighted.sort((a, b) => b.weight - a.weight)[0];
      callUsed = true;
      callBtn.disabled = true;
      lifelineStatus.innerHTML = '<strong>Call a Friend</strong>"I think it is ' + best.letter + '..."';
    }

    function useAudiencePoll() {
      if (pollUsed) return;

      const currentTier = Number((session[sessionIdx] && session[sessionIdx].tier) || 1);
      const letters = ['A', 'B', 'C', 'D'];
      const letterWeights = {};

      letters.forEach(letter => {
        const isCorrect = letter === currentCorrectLetter;
        const earlyRoundPenalty = currentTier <= 5 ? 0.18 : 0;
        if (isCorrect) {
          letterWeights[letter] = 0.38 + Math.random() * 0.2 - earlyRoundPenalty;
        } else {
          letterWeights[letter] = 0.16 + Math.random() * 0.22 + earlyRoundPenalty;
        }
      });

      const total = Object.values(letterWeights).reduce((sum, val) => sum + val, 0);
      const result = letters.map(letter => ({
        letter,
        percent: (letterWeights[letter] / total) * 100
      })).sort((a, b) => b.percent - a.percent);

      pollUsed = true;
      pollBtn.disabled = true;
      lifelineStatus.innerHTML = '<strong>Audience Poll</strong>' +
        result.map(item => item.letter + ': ' + Math.round(item.percent) + '%').join(' • ');
    }

    function revealAnswer() {
      const allBtns = [...optionsGrid.children];
      if (!allBtns.length) return;
      if (!answerLocked || !selectedLetter) return;

      const correctBtn = allBtns.find(b => b.dataset.letter === currentCorrectLetter);
      const selectedBtn = allBtns.find(b => b.dataset.letter === selectedLetter);
      const isCorrect = selectedLetter === currentCorrectLetter;

      if (selectedBtn) selectedBtn.classList.remove('locked');
      allBtns.forEach(b => b.disabled = true);
      if (correctBtn) correctBtn.classList.add('correct');
      if (selectedBtn && !isCorrect) {
        selectedBtn.classList.add('incorrect');
      }

      revealBtn.disabled = true;
      nextBtn.disabled = false;
      if (isCorrect) score++;
      playAnswerSound(isCorrect);
      stopTimer();
    }

    function lockAnswer() {
      if (answerLocked || !selectedLetter) return;

      const allBtns = [...optionsGrid.children];
      if (!allBtns.length) return;

      const selectedBtn = allBtns.find(b => b.dataset.letter === selectedLetter);
      allBtns.forEach(b => b.disabled = true);
      if (selectedBtn) {
        selectedBtn.classList.add('locked');
        selectedBtn.classList.remove('selected');
      }
      answerLocked = true;
      lockBtn.disabled = true;
      revealBtn.disabled = false;
    }

    function selectOption(letter, btnEl) {
      const allBtns = [...optionsGrid.children];
      if (answerLocked || btnEl.disabled || btnEl.style.visibility === 'hidden') return;

      selectedLetter = letter;
      allBtns.forEach(b => {
        if (b !== btnEl) b.classList.remove('selected');
      });
      btnEl.classList.add('selected');
      lockBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
      sessionIdx++;
      loadQuestion();
    });

    revealBtn.addEventListener('click', revealAnswer);
    lockBtn.addEventListener('click', lockAnswer);
    fiftyBtn.addEventListener('click', useFiftyFifty);
    callBtn.addEventListener('click', useCallFriend);
    pollBtn.addEventListener('click', useAudiencePoll);

    function showFinalScore() {
      quizArea.style.display = 'none';
      scoreBox.style.display = 'block';
      finalScoreText.textContent = 'Score: ' + score + ' / ' + session.length;
    }

    restartBtn.addEventListener('click', () => {
      quizArea.style.display = 'block';
      scoreBox.style.display = 'none';
      buildSession();
      loadQuestion();
    });

    /* ---------- independent 32s timer (always startable/stoppable) ---------- */
    let timerInterval = null;
    let timeLeft = 32;

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      stopTickSound();
      timeLeft = 32;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('running', 'warning');
      timerBtn.disabled = false;
      timerBtn.textContent = 'Start Timer';
    }

    function startTimer() {
      if (timerInterval !== null) return;
      unlockAudio();
      playTickSound();
      timeLeft = 32;
      timerCircle.textContent = timeLeft;
      timerCircle.classList.remove('warning');
      timerCircle.classList.add('running');
      timerBtn.disabled = true;
      timerBtn.textContent = 'Running...';

      timerInterval = setInterval(function () {
        timeLeft = timeLeft - 1;
        if (timeLeft <= 0) {
          timerCircle.textContent = '0';
          clearInterval(timerInterval);
          timerInterval = null;
          stopTickSound();
          timerBtn.disabled = false;
          timerBtn.textContent = 'Start Timer';
          timerCircle.classList.remove('running');
          return;
        }
        timerCircle.textContent = timeLeft;
        if (timeLeft <= 10) {
          timerCircle.classList.add('warning');
        }
      }, 1000);
    }

    timerBtn.addEventListener('click', () => {
      unlockAudio();
      startTimer();
    });
    document.addEventListener('pointerdown', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });
    optionsGrid.addEventListener('click', unlockAudio, { capture: true });

    /* ---------- init ---------- */
    buildSession();
    loadQuestion();
  </script>
